    <!-- JSON-LD: FAQPage (boosts search snippets for "how to" queries) -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is a system architecture bottleneck?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A system architecture bottleneck is any component — server, database, cache, or queue — that receives more traffic than it can handle, causing slowdowns or errors for the entire system. Common examples are database bottlenecks under high read load and single-instance servers with insufficient QPS capacity."
      }
    },
    {
      "@type": "Question",
      "name": "How do I find bottlenecks in my system architecture?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Use Bottlenecker: add a load generator and your system components (servers, databases, caches, queues) to the canvas, connect them with edges, and set the incoming QPS and each component's capacity. The simulation re-runs on every change and overloaded nodes turn red, showing where your architecture bottleneck is before it reaches production."
      }
    },
    {
      "@type": "Question",
      "name": "How can I avoid architecture bottlenecks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Common strategies to avoid architecture bottlenecks include: horizontal scaling (adding server instances), adding database read replicas, introducing a caching layer (Redis/CDN) to offload reads, and using message queues to buffer traffic spikes. In Bottlenecker you can try adding server instances, read replicas or a cache on the canvas and see how utilisation and error rates change before you build it."
      }
    },
    {
      "@type": "Question",
      "name": "What causes a database bottleneck?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Database bottlenecks occur when query volume exceeds the database's read or write QPS capacity. Retry storms (where upstream servers retry failed requests) can multiply load significantly. Adding read replicas, caching frequent queries, and separating read/write paths are the most effective fixes."
      }
    }
  ]
}
    </script>
